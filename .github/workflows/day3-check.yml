name: Day3 Backend Check
on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r $(find . -name requirements.txt | head -n 1)
      - name: Check project structure
        run: |
          find . -name app.py | grep -q app.py
          find . -name config.py | grep -q config.py
          find . -name models.py | grep -q models.py
          find . -name auth.py | grep -q auth.py
          find . -name events.py | grep -q events.py
          find . -name registrations.py | grep -q registrations.py
          find . -name auth_helpers.py | grep -q auth_helpers.py
      - name: Check security helpers
        run: |
          find . -name auth_helpers.py -exec grep -q "hash_password" {} \; && echo "PASS: hash_password" || echo "FAIL: hash_password"
          find . -name auth_helpers.py -exec grep -q "generate_token" {} \; && echo "PASS: jwt" || echo "FAIL: jwt"
          find . -name auth_helpers.py -exec grep -q "role_required" {} \; && echo "PASS: roles" || echo "FAIL: roles"
      - name: Check accessibility
        run: "grep -q 'accessibility' utils/accessibility.py && echo 'PASS: accessibility' || echo 'FAIL: accessibility'"

      - name: Syntax check
        run: |
          python -m py_compile $(find . -name "*.py")
      - run: "echo 'PASS: Day3 Backend Check completed'"
